schemaVersion: 1
outcomes: [planned, failed, host_failed]
outcome:
  from: outputs.decide.verdict
  onFailure: failed
  onInfrastructure: host_failed
steps:
  decide:
    kind: cmd
    infrastructureExitCodes: [71]
    command:
      argv: ["./scripts/decide.sh"]
    outputs:
      verdict:
        kind: text
        from: path
        path: verdict.txt
