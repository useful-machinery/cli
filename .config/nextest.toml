[test-groups]
# Keep process-heavy integration tests from exhausting host process capacity.
# Measured 2026-09-19 at 0569e4b7315aa128d39725682016fa968faa443e:
# aarch64-apple-darwin median wall time was 77.324s at cap 2 and 49.861s at cap 4;
# x86_64-unknown-linux-gnu was 144.579s at cap 2 and 145.593s at cap 4.
# Cap 8 was rejected after higher-cap-only failures on macOS.
external-process = { max-threads = 4 }
# macOS hosts, whose integration tests mostly wait on child processes, gain
# from a higher cap; check-suite also runs more test threads than CPUs there.
# Measured 2026-10-17 on a 10-CPU aarch64-apple-darwin host at load 25-37:
# 109-126 s at cap 4 with 10 threads, 100-107 s at cap 6 with 16 threads.
# Linux keeps cap 4 and one thread per CPU.
external-process-macos = { max-threads = 6 }

[profile.default]
# Report ordinary tests as slow after 30 seconds and terminate them after 60.
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Start both CPU-bound archive fixtures first with two thread slots each.
# Alone on 8-CPU x86_64 Linux at load 1-4, the archived-result fixture takes
# about 14 s. A larger result on a loaded host took 71.8 s with three test
# threads and exceeded 120 s at default concurrency. Thread slots cannot reserve CPU against
# other work. The fixture waits on nothing, so allow it 240 s under load.
filter = "package(useful-execution) & test(=workflow::local_run::tests::archived_attempt_loads_valid_result_larger_than_state_document_limit)"
priority = 100
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
# The carrier fixture took 6.7 s alone on the same host.
filter = "package(useful-execution) & test(=workflow::local_run::tests::artifact_set_carrier_boundary_is_shared_by_archive_and_portable_inspection)"
priority = 100
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# The stubborn-descendant fixture has a 30-second idle-host watchdog base that
# host_scaled_watchdog multiplies by the host's load, up to four times; it
# receives the integration-test backstop so the watchdog's diagnosis, not this
# termination, is what a loaded host reports.
filter = "package(useful-execution) & test(=workflow::pi::adapter_tests::stubborn_descendant_is_forced_at_the_injected_deadline_before_terminal_report)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# The runner's test waits have a 30-second idle-host base (FIXTURE_WAIT_BASE)
# that host_scaled_watchdog multiplies by the host's load, up to four times;
# the package receives the integration-test backstop so the watchdog's
# diagnosis, not this termination, is what a loaded host reports.
filter = "package(useful-runner)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# On macOS, the process-heavy tests below use the wider group instead. Only
# the group differs; the later overrides still set their timeouts.
platform = 'cfg(target_os = "macos")'
filter = "(package(useful-execution) & (test(workflow::pi::adapter_tests) | test(workflow::codex::adapter_tests))) | kind(test)"
test-group = "external-process-macos"

[[profile.default.overrides]]
# Pi and Codex adapter unit tests also launch process trees; share the
# process-capacity limit without widening their cancellation deadlines or the
# default slow-test backstop. Uncapped, the Codex fixtures miss their 10-second
# watchdogs on macOS once the rest of the suite overlaps them.
filter = "package(useful-execution) & (test(workflow::pi::adapter_tests) | test(workflow::codex::adapter_tests))"
test-group = "external-process"

[[profile.default.overrides]]
# Integration tests orchestrate external processes and receive a 120-second backstop.
filter = "kind(test)"
test-group = "external-process"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.timing]
# Same policy as the default profile, plus a JUnit report under the Cargo target
# directory so per-test durations can be ranked; used for timing baselines only.

[profile.timing.junit]
path = "junit.xml"
