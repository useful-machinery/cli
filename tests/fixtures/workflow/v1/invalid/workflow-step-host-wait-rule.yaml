schemaVersion: 1
steps:
  build:
    kind: workflow
    workflow: build.yaml
    on:
      host_failed:
        wait: host
        then: build
        limit: 2
        else: exit.failed
        rule:
          source: host
          event: host.healthy
          where: "event.run == run.id"
      succeeded: exit.succeeded
      failed: exit.failed
