# A definition rule names declared outcomes, never an engine outcome such as canceled.
schemaVersion: 1
inputs:
  ticket:
    kind: text
steps:
  prepare:
    kind: cmd
    command:
      argv: ["true"]
bindings:
  verify: {kind: definition}
triggers:
  repair:
    on: {definition: $verify, outcome: canceled}
    inputs:
      ticket: event.exports.repairRequest
